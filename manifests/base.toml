# sample-api / base — no managed services (in-memory store).
# Multi-workload: public web service + queue worker. Both workloads run
# from the one image; the worker simply idles (no queue bound) and the
# API stores records in memory. This is the variant that must run with
# zero managed services attached.
name = "sample-api-base"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 2
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"
hpa_min = 2
hpa_max = 6
hpa_target_cpu_pct = 75

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:latest"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[workloads]]
name = "worker"
kind = "deployment"
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "worker"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:latest"
  port = 0
  command = ["python", "entrypoint.py", "worker"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
