# sample-api / exotic — the long-tail managed-service kinds, attached for
# BINDING-PRESENCE coverage only. The app does NOT open live clients for
# these (it only ever really connects to postgres/redis/queue/object_store
# — see app/bindings.py SERVICES); this variant exercises the manifest
# parser + the env-injection envelope catalogue for the rarer kinds, and
# proves /debug + /selftest stay well-formed when unknown-to-the-app
# bindings are present.
#
# Kind names use the backend's canonical managed-service vocabulary
# (astrolift_drivers/service_catalog.py KIND_DESCRIPTIONS), which differs
# from the kind labels in spec 42 §4 — see this repo's README "Schema
# notes" for the mapping. AWS variants per §4.
name = "sample-api-exotic"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 2
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"
hpa_min = 2
hpa_max = 6
hpa_target_cpu_pct = 75

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:latest"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[workloads]]
name = "worker"
kind = "deployment"
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "worker"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:latest"
  port = 0
  command = ["python", "entrypoint.py", "worker"]

    [workloads.containers.env]
    LOG_LEVEL = "info"

# mysql — AWS RDS for MySQL. Envelope: MYSQL_HOST/PORT/DB/USER/PASSWORD + DATABASE_URL.
[[managed_services]]
kind = "mysql"
name = "legacy"
variant = "rds_mysql"

# search — AWS OpenSearch. Envelope: SEARCH_ENDPOINT/USER/PASSWORD/INDEX_PREFIX.
[[managed_services]]
kind = "search"
name = "fulltext"
variant = "opensearch"

# vector index — AWS OpenSearch (vector engine). Envelope: VECTOR_ENDPOINT/API_KEY/INDEX_NAME/NAMESPACE.
[[managed_services]]
kind = "vector_index"
name = "embeddings"
variant = "opensearch_vector"

# time series — AWS Timestream. Envelope: TS_ENDPOINT/DB/USER/PASSWORD/TOKEN/ORG.
[[managed_services]]
kind = "time_series"
name = "metrics"
variant = "timestream"

# email — AWS SES. Envelope: EMAIL_PROVIDER/API_KEY/DOMAIN/FROM.
[[managed_services]]
kind = "email"
name = "notify"
variant = "ses"

# model endpoint — AWS Bedrock. No connection envelope in the catalogue
# (binding-presence only); kind name per spec 42 §4 (not in the backend
# KIND_DESCRIPTIONS set — parses, emits no env). See README "Schema notes".
[[managed_services]]
kind = "model_endpoint"
name = "inference"
variant = "bedrock"
